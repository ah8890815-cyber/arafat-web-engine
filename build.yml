name: Build Android APK

on:
  repository_dispatch:
    types: [build-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova App & Build
        run: |
          cordova create myApp com.arafat.app "ArafatApp"
          rm -rf myApp/www/*
          cp -r * myApp/www/ 2>/dev/null || true
          cd myApp
          cordova platform add android
          cordova build android --nogradle

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-release
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
